[project]
name = "exp-tables"
version = "0.1.0"
description = "Experiment results to paper tables, honestly: runs from CSV, wandb, JSON, TensorBoard, MLflow or lm-evaluation-harness; means over seeds with their spread; significance tests and effect sizes; booktabs LaTeX, Markdown and HTML with the best marked only where the seeds support it; a check that the paper's tables still match."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["latex", "booktabs", "tables", "experiments", "seeds", "significance", "statistics", "research", "reproducibility", "tensorboard", "mlflow", "wandb", "lm-evaluation-harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# No dependencies: the statistics (t and Wilcoxon tests, bootstrap, corrections) are written out in the standard
# library, so the tool installs anywhere a paper is written.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/exp-tables"
Issues = "https://github.com/zch6a/exp-tables/issues"
Changelog = "https://github.com/zch6a/exp-tables/blob/main/CHANGELOG.md"

[project.scripts]
exp-tables = "exp_tables.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp_tables"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]  # images for the GitHub page only

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/exp_tables"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
