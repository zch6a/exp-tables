name: exp-tables
description: The tables in your paper still match your results. Remakes each table from its results and config, and fails when the committed table differs.
author: zch6a
branding:
  icon: grid
  color: green
inputs:
  config:
    description: The table's config file (made with exp-tables --save-config), relative to the repository
    required: true
  table:
    description: The committed table to compare with (the .tex, .md or .html file the paper includes)
    required: true
  format:
    description: 'The table''s format, when it is not the config''s: latex, markdown, html'
    default: ""
  fail:
    description: '"true" (default): fail the job when the table does not match; "false": only report'
    default: "true"
outputs:
  matches:
    description: '"true" when the committed table matches the results'
    value: ${{ steps.run.outputs.matches }}
runs:
  using: composite
  steps:
    # The tool at this action's own ref; the repository's results are read, nothing in it is run.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
    - id: run
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        TABLE: ${{ inputs.table }}
        FORMAT: ${{ inputs.format }}
        FAIL: ${{ inputs.fail }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(--config "$CONFIG")
        if [ -n "$FORMAT" ]; then args+=("--format=$FORMAT"); fi
        set +e
        out="$(uvx -q --from "$ACTION_PATH" exp-tables "${args[@]}" --check "$TABLE" 2>&1)"  # notes and errors too
        code=$?
        # 1 is "does not match" only when exp-tables says so; uvx's own failures (an install, a build) exit 1 too
        if [ "$code" -eq 1 ] && ! printf '%s' "$out" | grep -q "does not match the results"; then code=2; fi
        if [ "$code" -eq 0 ]; then echo "matches=true" >> "$GITHUB_OUTPUT"; else echo "matches=false" >> "$GITHUB_OUTPUT"; fi
        echo "$out"
        {
          echo "### exp-tables: \`$TABLE\`"
          echo
          echo '```diff'
          echo "$out"
          echo '```'
          if [ "$code" -ne 2 ]; then
            echo
            uvx -q --from "$ACTION_PATH" exp-tables --config "$CONFIG" --format markdown 2>/dev/null
            echo
            echo '<details><summary>What the marks rest on</summary>'
            echo
            echo '```text'
            uvx -q --from "$ACTION_PATH" exp-tables --config "$CONFIG" --report -o "$RUNNER_TEMP/exp-tables-table.txt" 2>/dev/null
            echo '```'
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"  # the summary is best effort: set +e still holds, and the exit status is the check's
        if [ "$code" -eq 2 ] || { [ "$code" -ne 0 ] && [ "$FAIL" = "true" ]; }; then exit "$code"; fi
        exit 0
