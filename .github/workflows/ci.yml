name: CI
on: [push, pull_request]
# Read-only: tests need no write access.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
        with:
          python-version: ${{ matrix.python }}
      # No test reaches the network: the results and event files are written by the tests.
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
  # The action itself: the example's table matches its results; a changed table does not.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: same
        uses: ./
        with:
          config: examples/table.json
          table: examples/table.tex
      - run: test "${{ steps.same.outputs.matches }}" = "true"
      - name: A table edited by hand no longer matches
        run: sed -i 's/94.06/94.60/' examples/table.tex
      - id: edited
        uses: ./
        with:
          config: examples/table.json
          table: examples/table.tex
          fail: "false"
      - run: test "${{ steps.edited.outputs.matches }}" = "false"
